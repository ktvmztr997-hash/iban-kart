<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IBAN Bilgileri</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; width: 100%; max-width: 400px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; border: 1px solid #334155; }
        h2 { font-size: 20px; color: #94a3b8; margin-bottom: 5px; }
        h1 { font-size: 24px; color: #ffffff; margin-bottom: 25px; font-weight: 600; }
        .iban-box { background: #0f172a; padding: 15px; border-radius: 12px; border: 1px solid #475569; margin-bottom: 20px; word-break: break-all; }
        .iban-text { font-family: monospace; font-size: 18px; color: #38bdf8; letter-spacing: 1px; font-weight: bold; }
        .btn { background: #22c55e; color: white; border: none; width: 100%; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #16a34a; }
        .toast { margin-top: 15px; font-size: 14px; color: #22c55e; opacity: 0; transition: opacity 0.3s; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Ödeme Bilgileri</h2>
        <!-- Müşteri Adını buraya yazabilirsin -->
        <h1 id="name">Müşteri Ad Soyad</h1> 
        
        <div class="iban-box">
            <div class="iban-text" id="iban">TR81 0001 5001 5800 7364 7811 99</div>
        </div>

        <button class="btn" onclick="copyIban()">IBAN'ı Kopyala</button>
        <div class="toast" id="toast">IBAN başarıyla kopyalandı!</div>
    </div>

    <script>
        function copyIban() {
            const ibanText = document.getElementById('iban').innerText;
            navigator.clipboard.writeText(ibanText);
            const toast = document.getElementById('toast');
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.opacity = '0';
            }, 2000);
        }
    </script>
</body>
</html>
